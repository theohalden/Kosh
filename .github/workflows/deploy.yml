name: Deploy

# Merge to main  ->  verify  ->  build + smoke-test the image  ->  publish to GHCR  ->  the VM pulls it  ->  confirm live.
# No secrets are used: publishing uses the workflow's own GITHUB_TOKEN, and the VM pulls a public image
# (outbound only), so nothing in GitHub can log in to, or reach into, the homelab.

on:
  push:
    branches: [main]
    paths:
      - 'apps/web/**'
      - 'deploy/sites/**'
      - 'scripts/build-static.mjs'
      - 'package.json'
      - 'package-lock.json'
      - '.node-version'
      - '.dockerignore'
      - '.github/workflows/deploy.yml'
  pull_request:
    paths:
      - 'apps/web/**'
      - 'deploy/sites/**'
      - 'scripts/build-static.mjs'
      - 'package.json'
      - 'package-lock.json'
      - '.dockerignore'
      - '.github/workflows/deploy.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  # Never cancel a deployment half-way; only supersede pull-request builds.
  group: deploy-${{ github.event_name == 'pull_request' && github.ref || 'production' }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  IMAGE: ghcr.io/theohalden/tinward-web
  SITE_URL: https://tinward.app

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version-file: '.node-version'
          cache: npm
          cache-dependency-path: package-lock.json
      - run: npm ci
      - run: npm run typecheck
      - run: npm run lint
      - run: npm run test:web
      - run: npm run test:web:db

  image:
    needs: verify
    runs-on: ubuntu-latest
    timeout-minutes: 25
    permissions:
      contents: read
      packages: write
    outputs:
      short: ${{ steps.meta.outputs.short }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - id: meta
        run: echo "short=${GITHUB_SHA::12}" >> "$GITHUB_OUTPUT"
      - uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3

      # 1. Build locally (nothing is published yet) so the exact image can be tested.
      - name: Build image
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6
        with:
          context: .
          file: deploy/sites/tinward/Dockerfile
          platforms: linux/amd64
          load: true
          tags: tinward-web:ci
          build-args: |
            NEXT_PUBLIC_SITE_URL=${{ env.SITE_URL }}
            GIT_SHA=${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      # 2. Run it the way production does (read-only, no capabilities) and check it serves the right things.
      - name: Smoke test the image
        run: |
          set -euo pipefail
          docker run -d --name smoke --read-only --tmpfs /tmp:uid=101,gid=101,size=16m \
            --cap-drop ALL --security-opt no-new-privileges -p 18080:8080 tinward-web:ci
          for i in $(seq 1 30); do curl -fsS http://127.0.0.1:18080/healthz >/dev/null 2>&1 && break; sleep 1; done
          curl -fsS http://127.0.0.1:18080/healthz
          curl -fsS http://127.0.0.1:18080/ | grep -q "All your money"
          curl -fsS http://127.0.0.1:18080/privacy/ >/dev/null
          test "$(curl -fsS http://127.0.0.1:18080/version.json | jq -r .sha)" = "${GITHUB_SHA}"
          test "$(curl -s -o /dev/null -w '%{http_code}' http://127.0.0.1:18080/api/admin/export)" = "404"
          test "$(curl -s -o /dev/null -w '%{http_code}' http://127.0.0.1:18080/definitely-missing)" = "404"
          # the deployed page must carry the real domain, never a localhost or tunnel address
          ! curl -fsS http://127.0.0.1:18080/ | grep -Eq 'localhost|trycloudflare'
          docker rm -f smoke >/dev/null

      # 3. Publish only from main. Pull requests stop after the test above.
      - name: Log in to GHCR
        if: github.event_name != 'pull_request'
        uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Publish image
        if: github.event_name != 'pull_request'
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6
        with:
          context: .
          file: deploy/sites/tinward/Dockerfile
          platforms: linux/amd64
          push: true
          provenance: true
          tags: |
            ${{ env.IMAGE }}:sha-${{ steps.meta.outputs.short }}
            ${{ env.IMAGE }}:main
          build-args: |
            NEXT_PUBLIC_SITE_URL=${{ env.SITE_URL }}
            GIT_SHA=${{ github.sha }}
          cache-from: type=gha

  confirm-live:
    # The VM checks for a new :main image every minute. This job waits until the public site reports this commit.
    if: github.event_name != 'pull_request'
    needs: image
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment:
      name: production
      url: https://tinward.app
    steps:
      - name: Wait for tinward.app to serve this commit
        run: |
          set -u
          for i in $(seq 1 45); do
            live="$(curl -fsS --max-time 10 "${SITE_URL}/version.json?ts=$(date +%s)" 2>/dev/null | jq -r .sha 2>/dev/null || true)"
            if [ "$live" = "${GITHUB_SHA}" ]; then echo "Live: ${SITE_URL} is serving ${GITHUB_SHA}"; exit 0; fi
            echo "[$i/45] live=${live:-unreachable} want=${GITHUB_SHA::12}"; sleep 20
          done
          echo "::error::${SITE_URL} did not report ${GITHUB_SHA} within 15 minutes. Check 'journalctl -u tinward-update' on the VM; it rolls back automatically if the new container is unhealthy."
          exit 1
