name: Web

on:
  pull_request:
    paths:
      - 'apps/web/**'
      - 'scripts/build-static.mjs'
      - 'deploy/**'
      - '.dockerignore'
      - 'package.json'
      - 'package-lock.json'
      - '.node-version'
      - '.github/workflows/web.yml'
  push:
    branches: [main]
    paths:
      - 'apps/web/**'
      - 'scripts/build-static.mjs'
      - 'deploy/**'
      - '.dockerignore'
      - 'package.json'
      - 'package-lock.json'
      - '.node-version'
      - '.github/workflows/web.yml'

permissions:
  contents: read

concurrency:
  group: kosh-web-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: '.node-version'
          cache: npm
          cache-dependency-path: package-lock.json
      - run: npm ci
      - run: npm run check:web
      - run: npm run build:static
