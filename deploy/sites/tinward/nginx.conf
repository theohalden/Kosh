worker_processes 1;
pid /tmp/nginx.pid;
error_log /dev/stderr warn;
events { worker_connections 512; }
http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;
    # Do not retain visitor IPs or email-action query strings in access logs.
    access_log off;
    server_tokens off;
    sendfile on;
    keepalive_timeout 30;
    client_max_body_size 8k;
    client_body_temp_path /tmp/client_temp;
    proxy_temp_path /tmp/proxy_temp;
    fastcgi_temp_path /tmp/fastcgi_temp;
    uwsgi_temp_path /tmp/uwsgi_temp;
    scgi_temp_path /tmp/scgi_temp;
    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml text/plain;
    server {
        listen 8080;
        root /usr/share/nginx/html;
        index index.html;
        add_header X-Content-Type-Options nosniff always;
        add_header X-Frame-Options DENY always;
        add_header Referrer-Policy strict-origin-when-cross-origin always;
        add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
        location = /healthz { default_type text/plain; return 200 "ok\n"; }
        location = /version.json {
            default_type application/json;
            add_header Cache-Control "no-store" always;
            add_header X-Content-Type-Options nosniff always;
        }
        location ^~ /api/admin/ { return 404; }
        location ^~ /api/dev/ { return 404; }
        location /api/ {
            default_type application/json;
            add_header Cache-Control no-store always;
            add_header X-Content-Type-Options nosniff always;
            return 503 '{"error":"unavailable","message":"Email signup is temporarily unavailable on this static preview."}';
        }
        location ~ /\. { return 404; }
        location / { try_files $uri $uri.html $uri/ =404; }
        error_page 404 /404.html;
        location = /404.html { internal; }
    }
}
