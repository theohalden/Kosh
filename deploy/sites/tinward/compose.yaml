name: tinward
services:
  web:
    # Built and published by CI (.github/workflows/deploy.yml); the VM updater sets an immutable digest.
    image: ${TINWARD_IMAGE:?Set TINWARD_IMAGE to an immutable image digest}
    restart: unless-stopped
    user: "101:101"
    read_only: true
    tmpfs:
      - /tmp:rw,noexec,nosuid,size=16m,uid=101,gid=101,mode=1770
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    pids_limit: 64
    mem_limit: 96m
    cpus: 0.50
    networks:
      proxy:
        aliases: [tinward-web]
    logging:
      driver: json-file
      options: {max-size: "5m", max-file: "2"}
networks:
  proxy:
    external: true
    name: web-proxy
